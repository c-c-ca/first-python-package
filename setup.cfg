[metadata]
name = pubpypack-harmony-adam-c-carter
version = 0.0.4
url = https://github.com/<username>/<package repo name>
author = Given Family
author_email = "Given Family" <given.family@example.com>
description = This package does amazing things.
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
license_files = LICENSE
classifiers =
    License :: OSI Approved :: MIT License

[options]
package_dir = 
    =src
packages = find:
include_package_data = True
python_requires = >=3.12
install_requires =
    termcolor>=1.1.0,<2

[options.packages.find]
where = src
exclude =
    test*

[options.entry_points]
console_scripts =
    harmony = imppkg.harmony:main

######################
# Tool configuration #
######################

[mypy]
python_version = 3.12
warn_unused_configs = True
show_error_context = True
pretty = True
namespace_packages = True
check_untyped_defs = True

[flake8]
max-line-length = 120

[tool:pytest]
testpaths = test
addopts = --cov --strict-markers
xfail_strict = True

[coverage:run]
source = imppkg
branch = True

[coverage:report]
show_missing = True
skip_covered = True

[coverage:paths]
source =
    src/imppkg
    */site-packages/imppkg

[tox:tox]
envlist = py312,py313
isolated_build = True

[testimports]
deps =
    pytest
    requests

[testenv]
deps =
    {[testimports]deps}
    pytest-cov
    pytest-randomly
commands =
    pytest {posargs}

[testenv:get_my_ip]
skip_install = True
deps =
    requests
commands =
    python -c "import requests; print(requests.get('https://canhazip.com').text)"

;[testenv:check-imports]
;deps =
;    {[testimports]deps}
;    shipyard
;commands =
;    python -m shipyard verify

[testenv:typecheck]
deps =
    pytest
    mypy
    types-termcolor
commands =
    mypy --ignore-missing-imports {posargs:src test}

[testenv:format]
skip_install = True
deps =
    black
commands =
    black {posargs:--check --diff src test}

[testenv:lint]
skip_install = True
deps =
    flake8
    flake8-bugbear
commands =
    flake8 {posargs:src test}

[testenv:docs]
deps =
    sphinx
commands =
    sphinx-apidoc \
        --force \
        --implicit-namespaces \
        --module-first \
        --separate \
        -o docs/reference/ \
        src/imppkg/ \
        src/imppkg/*.c \
        src/imppkg/*.so
    sphinx-build -n -W --keep-going -b html docs/ docs/_build/

[testenv:devdocs]
deps =
    sphinx
    sphinx-autobuild
commands =
    sphinx-apidoc \
        --force \
        --implicit-namespaces \
        --module-first \
        --separate \
        -o docs/reference/ \
        src/imppkg/ \
        src/imppkg/*.c \
        src/imppkg/*.so
    sphinx-autobuild -n -W -b html docs/ docs/_build/